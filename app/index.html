<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TIM — Intelligence Management. AI-native self-service аналитика: задайте вопрос на естественном языке и получите отчёт, график, SQL и рекомендации." />
    <link rel="icon" href="./logo-t1-innotech.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>TIM — Intelligence Management</title>
    <script>
      // Тема применяется до первой отрисовки — без смены цветов после загрузки
      ;(function () {
        try {
          var p = new URLSearchParams(location.search).get('theme')
          var saved = localStorage.getItem('t1m-theme')
          var valid = function (v) { return v === 'mixed' || v === 'light' || v === 'dark' }
          var mode = valid(p) ? p : valid(saved) ? saved : 'mixed'
          if (mode === 'dark') document.documentElement.classList.add('dark')
          if (mode === 'mixed') document.documentElement.classList.add('mixed')
          document.documentElement.style.colorScheme = mode === 'dark' ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
